<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Same UI as before.
      But now we are asking for fib(70).
      This would absolutely destroy single-threaded Node.
    -->
    <title>Fetch Request on Button Click</title>
  </head>

  <body>
    <h1>Fetch Request on Button Click</h1>

    <!--
      One button.
      Multiple CPU-bound requests.
      Node.js is about to delegate responsibility.
    -->
    <button id="fetchButton">Fetch Data</button>

    <script>
      console.log("Fetching Data....");

      // Client-side request counter (debugging only)
      let requestNumber = 0;

      /*
        fetchData()
        ----------
        Sends one HTTP request to the server.
        Each request asks for fib(70),
        which is VERY expensive computationally.
      */
      function fetchData() {
        fetch(
          "http://localhost:3000/fib?number=" +
            40 +
            "&requestNumber=" +
            requestNumber++
        )
          .then((response) => response.json())
          .then((data) => console.log("response: ", data))
          .catch((err) => console.error(err));
      }

      /*
        Button click handler
        --------------------
        - Fire a request every 100ms
        - Stop after 5 seconds
        - Creates heavy concurrent load
      */
      document
        .getElementById("fetchButton")
        .addEventListener("click", function () {
          const countId = setInterval(fetchData, 100);

          setTimeout(() => {
            clearInterval(countId);
          }, 5000);
        });
    </script>
  </body>
</html>
